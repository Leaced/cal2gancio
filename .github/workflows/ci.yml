name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'config.yml'
      - 'renovate.json'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  security-events: write
  actions: read
  id-token: write
  attestations: write
  pull-requests: write   # semantic-release dry-run: comment on PRs

jobs:
  # ── 0. REUSE licence compliance ──────────────────────────────────────────
  reuse:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6

  # ── 1. Build, push, scan ─────────────────────────────────────────────────
  build-push-scan:
    needs: [reuse]
    uses: ./.github/workflows/_build-scan.yml
    secrets: inherit

  # ── 2. Dry-run release preview ───────────────────────────────────────────
  release-dry-run:
    needs: [build-push-scan]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout (full history for semantic-release)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Semantic Release (dry run)
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        with:
          dry_run: true
          extra_plugins: |
            @semantic-release/commit-analyzer
            @semantic-release/release-notes-generator
            @semantic-release/github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
