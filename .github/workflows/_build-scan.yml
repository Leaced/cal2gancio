name: _build-scan (reusable)

# Called by ci.yml (PR-only workflow).
# Builds a single-arch OCI image, pushes it as pr-N-sha, signs it, then runs Trivy.
# Pipeline fails on CRITICAL or HIGH vulnerabilities where a fix is available
# (--ignore-unfixed skips issues with no upstream patch yet).

on:
  workflow_call:
    outputs:
      scan-ref:
        description: "Full image reference that was built and pushed"
        value: ${{ jobs.build-push-scan.outputs.scan-ref }}

jobs:
  build-push-scan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      security-events: write
      actions: read            # codeql-action/upload-sarif needs this for workflow metadata
      id-token: write          # cosign + attest-build-provenance: OIDC token for keyless signing
      attestations: write      # attest-build-provenance: write SLSA provenance attestation
    outputs:
      scan-ref: ${{ steps.scan-ref.outputs.ref }}

    steps:
      - name: Compute image tags
        id: tags
        run: |
          # Use the PR head commit SHA, not GITHUB_SHA: in pull_request events
          # GITHUB_SHA is GitHub's temporary test-merge commit, which differs
          # from head.sha that the release workflow uses to locate this image.
          SHA="${{ github.event.pull_request.head.sha }}"
          SHA="${SHA::8}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          TAGS="${IMAGE}:pr-${{ github.event.number }}-${SHA}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "${TAGS}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Build image
        id: build
        uses: redhat-actions/buildah-build@3a51aade9afa17e5c78256bcbe2e1ee08c7b995b # v3.0.2
        with:
          tags:           ${{ steps.tags.outputs.tags }}
          platforms:      linux/amd64
          containerfiles: ./Containerfile
          oci:            true

      - name: Push image
        id: push
        uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37 # v3.0.0
        with:
          tags:     ${{ steps.build.outputs.tags }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set scan-ref
        id: scan-ref
        run: |
          SHA="${{ github.event.pull_request.head.sha }}"
          SHA="${SHA::8}"
          echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}:pr-${{ github.event.number }}-${SHA}" \
            >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image with Cosign (keyless)
        run: |
          cosign sign --yes \
            "ghcr.io/${GITHUB_REPOSITORY,,}@${{ steps.push.outputs.digest }}"
        env:
          COSIGN_REGISTRY_USERNAME: ${{ github.actor }}
          COSIGN_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Authenticate to GHCR for attestation
        # push-to-registry: true on the attest action reads from ~/.docker/config.json;
        # redhat-actions/push-to-registry manages its own auth and does not write it.
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name:   ${{ steps.tags.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Trivy vulnerability scan (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref:      ${{ steps.scan-ref.outputs.ref }}
          format:         sarif
          output:         trivy-results.sarif
          ignore-unfixed: true
          vuln-type:      "os,library"
          severity:       "CRITICAL,HIGH"
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: trivy-results.sarif
          category:   trivy-image

      - name: Fail on fixable CRITICAL/HIGH vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref:      ${{ steps.scan-ref.outputs.ref }}
          format:         table
          exit-code:      "1"
          ignore-unfixed: true
          vuln-type:      "os,library"
          severity:       "CRITICAL,HIGH"
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
