name: Cleanup container images

on:
  # Remove PR images (and their cosign signatures) when a PR is closed.
  pull_request:
    types: [closed]

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - name: Delete PR images and their cosign signatures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          set -euo pipefail
          PACKAGE="${GITHUB_REPOSITORY##*/}"
          PREFIX="pr-${PR_NUMBER}-"

          # For merged PRs, skip the HEAD commit image: the release pipeline needs
          # it as the source for skopeo re-tag. Once re-tagged as vX.Y.Z the version
          # is protected by the tag filter and will never be accidentally deleted.
          SKIP_TAG=""
          if [[ "${{ github.event.pull_request.merged }}" == "true" ]]; then
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            SKIP_TAG="${PREFIX}${HEAD_SHA:0:8}"
            echo "PR merged — skipping ${SKIP_TAG} (source for release re-tag)"
          fi

          # OCI token for fetching cosign index manifests to discover child digests.
          # Cosign stores signatures as an OCI index tagged sha256-<image-digest>;
          # each index has one or more untagged child manifests that must be deleted
          # explicitly — GHCR does not GC children when the parent index is deleted.
          OCI_TOKEN=$(curl -s -u "x:${GH_TOKEN}" \
            "https://ghcr.io/token?scope=repository:${GITHUB_REPOSITORY,,}:pull&service=ghcr.io" \
            | jq -r '.token')

          # Fetch all package versions (tagged and untagged) once
          gh api "/user/packages/container/${PACKAGE}/versions" --paginate \
            | jq -c '.[]' > /tmp/versions.ndjson

          DELETED_IMAGES=0
          DELETED_COSIGN=0

          while IFS= read -r v; do
            image_id=$(echo "$v" | jq -r '.id')
            digest=$(echo "$v" | jq -r '.name')
            tag=$(echo "$v" | jq -r '.metadata.container.tags[0]')

            echo "Deleting image: ${tag} (id=${image_id})"
            if gh api --method DELETE \
                "/user/packages/container/${PACKAGE}/versions/${image_id}"; then
              DELETED_IMAGES=$((DELETED_IMAGES + 1))

              # Cosign OCI index tag for this image: sha256-<hex> (no .sig/.att suffix)
              sig_tag="${digest/sha256:/sha256-}"
              sig_vid=$(jq -r --arg t "$sig_tag" \
                'select(.metadata.container.tags | contains([$t])) | .id' \
                /tmp/versions.ndjson | head -1)

              if [[ -n "$sig_vid" ]]; then
                # Fetch child digests from the cosign index before deleting it
                mapfile -t children < <(curl -s \
                  -H "Authorization: Bearer ${OCI_TOKEN}" \
                  -H "Accept: application/vnd.oci.image.index.v1+json" \
                  "https://ghcr.io/v2/${GITHUB_REPOSITORY,,}/manifests/${sig_tag}" \
                  | jq -r '.manifests[]?.digest' 2>/dev/null || true)

                # Delete each untagged child manifest (cosign signature bundle)
                for child_digest in "${children[@]+"${children[@]}"}"; do
                  [[ -z "$child_digest" ]] && continue
                  child_vid=$(jq -r --arg d "$child_digest" \
                    'select(.name == $d) | .id' \
                    /tmp/versions.ndjson | head -1)
                  if [[ -n "$child_vid" ]]; then
                    echo "  Deleting cosign child: ${child_digest} (id=${child_vid})"
                    gh api --method DELETE \
                      "/user/packages/container/${PACKAGE}/versions/${child_vid}" \
                      || echo "  ⚠ Could not delete cosign child."
                  fi
                done

                echo "  Deleting cosign index: ${sig_tag} (id=${sig_vid})"
                gh api --method DELETE \
                  "/user/packages/container/${PACKAGE}/versions/${sig_vid}" \
                  || echo "  ⚠ Could not delete cosign index."
                DELETED_COSIGN=$((DELETED_COSIGN + 1))
              fi
            else
              echo "  ⚠ Could not delete image — skipping cosign artifacts."
            fi

          done < <(jq -c --arg prefix "$PREFIX" --arg skip "$SKIP_TAG" '
            select(
              (.metadata.container.tags | length > 0) and
              (.metadata.container.tags | all(startswith($prefix))) and
              ($skip == "" or (.metadata.container.tags | contains([$skip]) | not))
            )
          ' /tmp/versions.ndjson)

          echo "Done: ${DELETED_IMAGES} image(s), ${DELETED_COSIGN} cosign index(es) deleted."
