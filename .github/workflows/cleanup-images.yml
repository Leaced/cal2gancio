name: Cleanup container images

on:
  # Remove PR images when a PR is closed (merged or dismissed).
  pull_request:
    types: [closed]
    paths-ignore:
      - '**.md'
      - 'config.yml'
      - '.github/**'
      - 'renovate.json'
  # Remove stale main-<sha> and untagged images after every push to main.
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'config.yml'
      - '.github/**'
      - 'renovate.json'

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - name: Delete PR container image versions
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          PACKAGE="${GITHUB_REPOSITORY##*/}"
          PREFIX="pr-${PR_NUMBER}-"

          # Only delete versions where every tag belongs to this PR.
          # Versions also tagged as latest, main, or vX.Y.Z are skipped.
          gh api "/user/packages/container/${PACKAGE}/versions" --paginate \
            --jq ".[] | select(
              (.metadata.container.tags | length > 0) and
              (.metadata.container.tags | all(startswith(\"${PREFIX}\")))
            ) | .id" | \
          while IFS= read -r version_id; do
            echo "Deleting version ${version_id} (only has ${PREFIX}* tags)"
            gh api --method DELETE \
              "/user/packages/container/${PACKAGE}/versions/${version_id}" \
              && echo "  Deleted." || echo "  Could not delete — skipping."
          done

      - name: Delete stale and untagged image versions
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PACKAGE="${GITHUB_REPOSITORY##*/}"

          # Delete versions that are either:
          # (a) untagged — orphaned manifests incl. leftover Cosign .sig entries
          # (b) tagged only with main-<sha> or sha256-<sha>.sig patterns —
          #     stale CI builds superseded by a newer push to main
          #
          # Protected: any version carrying latest, main, or a vX.Y.Z tag.
          gh api "/user/packages/container/${PACKAGE}/versions" --paginate \
            --jq '.[] | select(
              (.metadata.container.tags | length == 0)
              or
              (.metadata.container.tags | length > 0
                and all(test("^(main-[0-9a-f]+|sha256-[0-9a-f]+\\.sig)$")))
            ) | .id' | \
          while IFS= read -r version_id; do
            echo "Deleting stale version ${version_id}"
            gh api --method DELETE \
              "/user/packages/container/${PACKAGE}/versions/${version_id}" \
              && echo "  Deleted." || echo "  Could not delete — skipping."
          done
